# The compose stack's equivalent of client/vercel.json: an SPA fallback plus a
# same-origin /api, so the client code is identical in both.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /boards/:slug and /settings are React Router's, not the filesystem's.
    # Without this they 404 on a refresh — the same reason vercel.json ends with
    # a catch-all rewrite to /index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Every REST call in the client is a relative /api path. Here nginx is what
    # resolves it; on Vercel it is a rewrite; in development it is the Vite dev
    # proxy. No API base URL is ever baked into the bundle.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The socket does NOT come through here. It connects straight to the API on
    # its published port (VITE_API_URL), exactly as it does in the deployment,
    # where a Vercel rewrite cannot carry a WebSocket upgrade either. That also
    # means the compose stack exercises the same CORS allowlist production does.
}
